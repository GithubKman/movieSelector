<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage · movieSelector</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">movie<span>Selector</span></a>
    <nav><a href="/">Browse</a><a href="/manage" class="active">Manage</a></nav>
    <div class="spacer"></div>
    <nav><button id="logout" class="hidden">Log out</button></nav>
  </header>

  <form class="login hidden" id="login">
    <h1>Management mode</h1>
    <p>Enter the admin token (the <code>ADMIN_TOKEN</code> environment variable).</p>
    <input type="password" id="token" placeholder="Admin token" autocomplete="current-password" autofocus>
    <div class="err" id="login-err"></div>
    <button class="btn primary" type="submit">Unlock</button>
  </form>

  <main id="app" class="hidden">
    <div class="toolbar">
      <div id="filters" style="display:flex;gap:8px;flex-wrap:wrap"></div>
      <div class="spacer"></div>
      <div class="seg" id="type">
        <button type="button" data-type="" class="on">All</button>
        <button type="button" data-type="movie">Movies</button>
        <button type="button" data-type="tv">Shows</button>
      </div>
    </div>
    <div class="toolbar">
      <span class="section-title" style="margin:0">Export</span>
      <a class="btn small" id="exp-txt" target="_blank">Folder names</a>
      <a class="btn small" id="exp-csv">CSV</a>
      <a class="btn small" id="exp-json" target="_blank">JSON</a>
      <div class="spacer"></div>
      <button class="btn small" id="digest-preview">Preview digest</button>
      <button class="btn small" id="digest-send">Send digest now</button>
    </div>
    <div class="list" id="list"></div>
    <div class="empty hidden" id="empty">Nothing here.</div>
  </main>

  <dialog id="dialog">
    <h3 id="dialog-title" style="margin-top:0"></h3>
    <pre id="dialog-body"></pre>
    <form method="dialog" style="text-align:right"><button class="btn">Close</button></form>
  </dialog>

  <script src="/static/common.js"></script>
  <script src="/static/manage.js"></script>
</body>
</html>
